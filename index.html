<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Miyomi has moved to miyomi.app">
  <meta http-equiv="refresh" content="8;url=https://miyomi.app">
  <title>Miyomi has moved</title>

  <style>
    :root {
      color-scheme: dark;
      --page: #0b0d12;
      --surface: #141821;
      --border: #2a3240;
      --text: #f4f7fb;
      --muted: #aab4c3;
      --accent: #6ea8fe;
      --accent-hover: #91bdff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, #1b315b 0, transparent 45%),
        var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 52px);
      text-align: center;
      background: rgba(20, 24, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }

    .brand {
      margin: 0 0 32px;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 750;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.045em;
    }

    p {
      max-width: 48ch;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .destination {
      display: block;
      margin: 32px 0 16px;
      padding: 16px 20px;
      color: var(--text);
      background: #0e1219;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 650;
      text-decoration: none;
    }

    .destination:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      margin-top: 8px;
      color: #08111f;
      background: var(--accent);
      border-radius: 10px;
      font-weight: 750;
      text-decoration: none;
    }

    .button:hover {
      background: var(--accent-hover);
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 32px;
    }

    .socials a {
      padding: 9px 14px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 650;
      text-decoration: none;
    }

    .socials a:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .redirect-note {
      margin-top: 26px;
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">MIYOMI</div>

    <h1>We’ve moved.</h1>

    <p>
      This page is no longer maintained. Visit the new Miyomi website for
      current information and resources.
    </p>

    <a class="destination" href="https://miyomi.app">miyomi.app</a>
    <a class="button" href="https://miyomi.app">Go to Miyomi</a>

    <div class="socials" aria-label="Miyomi social media">
      <a
        href="https://www.youtube.com/@iitachiyomi"
        target="_blank"
        rel="noopener noreferrer"
      >
        YouTube
      </a>
    </div>

    <p class="redirect-note">
      Redirecting in <span id="countdown">8</span> seconds.
    </p>
  </main>

  <script>
    const destination = "https://miyomi.app";
    const countdownElement = document.getElementById("countdown");
    let remaining = 8;

    const timer = window.setInterval(() => {
      remaining -= 1;
      countdownElement.textContent = remaining;

      if (remaining <= 0) {
        window.clearInterval(timer);
        window.location.assign(destination);
      }
    }, 1000);
  </script>
</body>
</html>
